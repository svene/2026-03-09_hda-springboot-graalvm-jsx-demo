# Server-side render bundle, loaded by JsHolder via GraalVM. Kept under /graaljs/
# (NOT /static/, /public/, /resources/ or /META-INF/resources/) so Spring's static
# resource handler does not serve it to the browser.
app.ssr.resource=classpath:/graaljs/ssr.js

# HSQLDB in-memory database
spring.datasource.url=jdbc:hsqldb:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=sa
spring.datasource.password=

# Disable Boot SQL init (REQUIRED in Boot 4):
spring.sql.init.mode=never
