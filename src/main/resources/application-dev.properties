# --------------- devtools ---------------
# graaljs/** holds the esbuild SSR bundle; JsBundleWatcher reloads the GraalVM
# pool itself, so keep it out of the DevTools JVM-restart trigger.
spring.devtools.restart.exclude=graaljs/**
# Browser reload is handled by our own SSE endpoint (DevReloadSSE), not devtools livereload:
spring.devtools.livereload.enabled=false
# --------------- / ---------------
